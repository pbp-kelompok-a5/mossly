{% extends "base.html" %}
{% block title %}Dashboard · Mossly{% endblock %}
{% block content %}
  <section class="card" aria-labelledby="dashboard-title">
    <h1 id="dashboard-title" class="text-h2">Halo, {{ user.get_username }}!</h1>
    <p class="text-body-m" style="margin-block: var(--space-6); color: var(--color-text-secondary);">Kamu sudah masuk ke Mossly. Dashboard lengkap sedang disiapkan.</p>
    <form action="{% url 'accounts:logout' %}" method="post">
      {% csrf_token %}
      <button class="btn" type="submit">Keluar dari akun</button>
    </form>
  </section>
{% endblock %}
