{% extends 'community/base.html' %}

{% block community_title %}Hapus cerita{% endblock %}

{% block community_content %}
  <div class="reading-layout">
    <section class="form-card delete-card">
      <span class="empty-flower" aria-hidden="true">❋</span>
      <h1>Hapus cerita ini?</h1>
      <p>
        “{{ thread.title }}” beserta seluruh balasan dan apresiasinya akan
        dihapus permanen.
      </p>

      <form method="post" class="form-actions">
        {% csrf_token %}
        <button class="button danger" type="submit">Ya, hapus cerita</button>
        <a href="{% url 'community:detail' thread.pk %}">
          Batal, simpan cerita
        </a>
      </form>
    </section>
  </div>
{% endblock %}
