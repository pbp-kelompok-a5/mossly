{% if form.non_field_errors %}
  <div class="field-errors field-errors--summary" role="alert">
    {{ form.non_field_errors }}
  </div>
{% endif %}

{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}

    {% if field.errors %}
      <div
        class="field-errors"
        id="{{ field.auto_id }}_error"
        role="alert"
      >
        {{ field.errors }}
      </div>
    {% endif %}

    {% if field.help_text %}
      <small>{{ field.help_text }}</small>
    {% endif %}
  </div>
{% endfor %}
